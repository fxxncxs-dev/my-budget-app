<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Budget iOS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        :root { --ios-bg: #000; --ios-card: #1c1c1e; --ios-blue: #007AFF; }
        body { background: var(--ios-bg); color: #fff; font-family: -apple-system, system-ui, sans-serif; transition: opacity 0.3s; }
        .ios-card { background: var(--ios-card); border-radius: 14px; overflow: hidden; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .bottom-sheet { position: fixed; bottom: 0; left: 0; right: 0; background: #1c1c1e; border-top-left-radius: 20px; border-top-right-radius: 20px; transform: translateY(100%); transition: transform 0.4s cubic-bezier(0.15, 1, 0.3, 1); z-index: 100; max-height: 90vh; overflow-y: auto; }
        .bottom-sheet.active { transform: translateY(0); }
        .strikethrough { text-decoration: line-through; opacity: 0.3; transform: scale(0.95); transition: 0.5s; }
        
        /* Swipe styles */
        .swipe-item { position: relative; touch-action: pan-y; overflow: hidden; border-radius: 14px; margin-bottom: 8px; }
        .swipe-content { position: relative; z-index: 2; transition: transform 0.3s; background: var(--ios-card); }
        .swipe-bg { position: absolute; top: 0; bottom: 0; width: 100%; display: flex; align-items: center; px: 20px; font-weight: bold; }
        .bg-undo { background: var(--ios-blue); color: white; justify-content: flex-start; padding-left: 20px; }
        .bg-delete { background: #ff3b30; color: white; justify-content: flex-end; padding-right: 20px; }
    </style>
</head>
<body class="safe-top">

    <header class="p-6 sticky top-0 bg-black/80 backdrop-blur-xl z-40 flex justify-between items-center">
        <h1 id="view-title" class="text-3xl font-bold">August</h1>
        <div id="plus-btn" class="hidden">
            <button onclick="openModal()" class="text-blue-500 text-2xl"><i class="fa-solid fa-plus"></i></button>
        </div>
    </header>

    <main id="app" class="px-4 pb-32">
        <div id="view-action" class="tab-content active space-y-3"></div>
        <div id="view-terms" class="tab-content space-y-4"></div>
        <div id="view-fixed" class="tab-content space-y-2"></div>
        <div id="view-history" class="tab-content"></div>
    </main>

    <!-- Bottom Navigation -->
    <nav class="fixed bottom-0 w-full bg-[#161618]/90 backdrop-blur-xl border-t border-white/10 pb-8 pt-3 z-50">
        <div class="flex justify-around">
            <button onclick="switchTab('action')" class="tab-btn text-blue-500 flex flex-col items-center" data-tab="action"><i class="fa-solid fa-bolt text-xl"></i><span class="text-[10px] mt-1">Action</span></button>
            <button onclick="switchTab('terms')" class="tab-btn text-gray-500 flex flex-col items-center" data-tab="terms"><i class="fa-solid fa-calendar text-xl"></i><span class="text-[10px] mt-1">Terms</span></button>
            <button onclick="switchTab('fixed')" class="tab-btn text-gray-500 flex flex-col items-center" data-tab="fixed"><i class="fa-solid fa-layer-group text-xl"></i><span class="text-[10px] mt-1">Fixed</span></button>
            <button onclick="switchTab('history')" class="tab-btn text-gray-500 flex flex-col items-center" data-tab="history"><i class="fa-solid fa-clock text-xl"></i><span class="text-[10px] mt-1">History</span></button>
        </div>
    </nav>

    <!-- Modal Sheets -->
    <div id="sheet-fixed" class="bottom-sheet p-6">
        <div class="flex justify-between items-center mb-6">
            <button onclick="closeModal()" class="text-blue-500">Cancel</button>
            <span class="font-bold">Fixed Bill</span>
            <button onclick="submitFixed()" class="text-blue-500 font-bold">Save</button>
        </div>
        <div class="space-y-4">
            <input type="text" id="f-name" placeholder="Expense Name" class="w-full bg-[#2c2c2e] p-4 rounded-xl outline-none">
            <input type="number" id="f-amount" placeholder="Amount" class="w-full bg-[#2c2c2e] p-4 rounded-xl outline-none">
            <select id="f-freq" onchange="toggleDateUI()" class="w-full bg-[#2c2c2e] p-4 rounded-xl outline-none"><option>Monthly</option><option>Weekly</option></select>
            <div id="f-date-container"></div>
            <input type="text" id="f-note" placeholder="Note" class="w-full bg-[#2c2c2e] p-4 rounded-xl outline-none">
        </div>
    </div>

    <div id="sheet-terms" class="bottom-sheet p-6">
        <div class="flex justify-between items-center mb-6">
            <button onclick="closeModal()" class="text-blue-500">Cancel</button>
            <span class="font-bold">New Term</span>
            <button onclick="submitTerm()" class="text-blue-500 font-bold">Save</button>
        </div>
        <div class="space-y-4">
            <input type="text" id="t-name" placeholder="Expense Name" class="w-full bg-[#2c2c2e] p-4 rounded-xl outline-none">
            <input type="number" id="t-balance" placeholder="Starting Balance" class="w-full bg-[#2c2c2e] p-4 rounded-xl outline-none">
            <div class="grid grid-cols-2 gap-3">
                <input type="date" id="t-start" class="bg-[#2c2c2e] p-4 rounded-xl outline-none">
                <input type="number" id="t-day" placeholder="Due Day" class="bg-[#2c2c2e] p-4 rounded-xl outline-none">
            </div>
            <input type="number" id="t-amount" placeholder="Payment Amount" class="w-full bg-[#2c2c2e] p-4 rounded-xl outline-none">
        </div>
    </div>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbxJcbFW4sdWpCwDvmDmeDRn4krp5_qLVutC_Ui46RdcTmeT-NTaJ47STkG9xaU50beGkw/exec"; 
        let db = { action: [], terms: [], fixed: [], history: [] };
        let activeTab = 'action';

        async function refreshData() {
            const res = await fetch(API_URL);
            db = await res.json();
            render();
        }

        function render() {
            renderAction();
            renderTerms();
            renderFixed();
            renderHistory();
        }

        function renderAction() {
            const container = document.getElementById('view-action');
            container.innerHTML = db.action.map(item => `
                <div class="ios-card p-4 flex items-center justify-between" id="item-${item.ID}">
                    <div class="flex items-center space-x-4">
                        <button onclick="markPaid('${item.ID}')" class="w-7 h-7 rounded-full border-2 border-gray-600 flex items-center justify-center">
                            <div class="inner-check w-4 h-4 rounded-full transition-all"></div>
                        </button>
                        <div>
                            <p class="font-bold text-lg">${item.Name}</p>
                            <p class="text-xs text-gray-500 italic">Due: ${item.DueDate}</p>
                        </div>
                    </div>
                    <p class="text-xl font-medium">${Number(item.Amount).toLocaleString()}</p>
                </div>
            `).join('') || '<p class="text-center text-gray-600 py-10">Clear!</p>';
        }

        async function markPaid(id) {
            const el = document.getElementById(`item-${id}`);
            el.classList.add('strikethrough');
            el.querySelector('.inner-check').style.background = '#34C759';
            
            await fetch(API_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify({ action: 'completeAction', id: id }) });
            setTimeout(refreshData, 600);
        }

        function renderTerms() {
            const container = document.getElementById('view-terms');
            container.innerHTML = db.terms.map(t => {
                const remTerm = Math.ceil(t.RemainingBalance / t.PaymentAmount);
                return `
                <div class="ios-card p-5 space-y-4">
                    <div class="flex justify-between items-center">
                        <h2 class="text-xl font-bold">${t.Name}</h2>
                        <span class="text-blue-500 font-bold text-xs uppercase">${t.Frequency}</span>
                    </div>
                    <div class="grid grid-cols-2 gap-2">
                        <div class="bg-white/5 p-3 rounded-xl"><p class="text-[10px] text-gray-500 uppercase">Payment</p><p class="text-lg font-bold">${Number(t.PaymentAmount).toLocaleString()}</p></div>
                        <div class="bg-white/5 p-3 rounded-xl"><p class="text-[10px] text-gray-500 uppercase">Balance</p><p class="text-lg font-bold">${Number(t.RemainingBalance).toLocaleString()}</p></div>
                        <div class="bg-white/5 p-3 rounded-xl col-span-2 text-center"><p class="text-[10px] text-gray-500 uppercase">Remaining Terms</p><p class="text-lg font-bold">${remTerm} Months</p></div>
                    </div>
                </div>`;
            }).join('');
        }

        function renderFixed() {
            const container = document.getElementById('view-fixed');
            container.innerHTML = db.fixed.map(f => `
                <div class="flex justify-between items-center py-4 border-b border-white/5">
                    <div><p class="font-bold">${f.Name}</p><p class="text-xs text-gray-500">${f.Frequency} • ${f.DueDay}</p></div>
                    <p class="font-semibold text-lg">${Number(f.Amount).toLocaleString()}</p>
                </div>
            `).join('');
        }

        function renderHistory() {
            const container = document.getElementById('view-history');
            container.innerHTML = db.history.map(h => `
                <div class="swipe-item" ontouchstart="startSwipe(event)" ontouchend="endSwipe(event, '${h.ID}')">
                    <div class="swipe-bg bg-undo">Mark Unpaid</div>
                    <div class="swipe-bg bg-delete">Delete</div>
                    <div class="swipe-content p-4 flex items-center justify-between">
                        <div class="flex items-center space-x-3">
                            <i class="fa-solid fa-circle-check text-blue-500"></i>
                            <div><p class="text-gray-400 font-bold">${h.Name}</p><p class="text-[10px] text-gray-600">${new Date(h.PaidDate).toLocaleDateString()}</p></div>
                        </div>
                        <p class="text-gray-500 font-bold">${Number(h.Amount).toLocaleString()}</p>
                    </div>
                </div>
            `).join('');
        }

        // Swipe Logic
        let touchStart = 0;
        function startSwipe(e) { touchStart = e.touches[0].clientX; }
        async function endSwipe(e, id) {
            const diff = e.changedTouches[0].clientX - touchStart;
            const content = e.currentTarget.querySelector('.swipe-content');
            if (diff > 100) { 
                content.style.transform = "translateX(100%)";
                await callBackend('undoHistory', id);
            } else if (diff < -100) {
                if (confirm("Delete this record?")) {
                    content.style.transform = "translateX(-100%)";
                    await callBackend('deleteHistory', id);
                }
            }
        }

        async function callBackend(action, id) {
            await fetch(API_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify({ action: action, id: id }) });
            refreshData();
        }

        function switchTab(tab) {
            activeTab = tab;
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.replace('text-blue-500', 'text-gray-500'));
            document.getElementById(`view-${tab}`).classList.add('active');
            document.querySelector(`[data-tab="${tab}"]`).classList.replace('text-gray-500', 'text-blue-500');
            document.getElementById('plus-btn').className = (tab === 'fixed' || tab === 'terms') ? '' : 'hidden';
            document.getElementById('view-title').innerText = tab === 'action' ? 'August' : tab.charAt(0).toUpperCase() + tab.slice(1);
        }

        function openModal() { document.getElementById(`sheet-${activeTab}`).classList.add('active'); toggleDateUI(); }
        function closeModal() { document.querySelectorAll('.bottom-sheet').forEach(s => s.classList.remove('active')); }

        function toggleDateUI() {
            const freq = document.getElementById('f-freq').value;
            const container = document.getElementById('f-date-container');
            if (freq === 'Monthly') {
                container.innerHTML = `<select id="f-day" class="w-full bg-[#2c2c2e] p-4 rounded-xl outline-none">${[...Array(31).keys()].map(i => `<option>${i+1}</option>`).join('')}</select>`;
            } else {
                const days = ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday", "Sunday"];
                container.innerHTML = `<select id="f-day" class="w-full bg-[#2c2c2e] p-4 rounded-xl outline-none">${days.map(d => `<option>${d}</option>`).join('')}</select>`;
            }
        }

        async function submitFixed() {
            const data = { name: document.getElementById('f-name').value, amount: document.getElementById('f-amount').value, freq: document.getElementById('f-freq').value, dueDay: document.getElementById('f-day').value, note: document.getElementById('f-note').value };
            await fetch(API_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify({ action: 'addFixed', data: data }) });
            closeModal(); refreshData();
        }

        async function submitTerm() {
            const data = { name: document.getElementById('t-name').value, balance: document.getElementById('t-balance').value, start: document.getElementById('t-start').value, dueDay: document.getElementById('t-day').value, amount: document.getElementById('t-amount').value, freq: 'Monthly' };
            await fetch(API_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify({ action: 'addTerm', data: data }) });
            closeModal(); refreshData();
        }

        window.onload = refreshData;
    </script>
</body>
</html>
