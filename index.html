<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
    <title>Budget</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --ios-bg: #000; --ios-card: #1c1c1e; --ios-card-2: #2c2c2e;
            --ios-blue: #0A84FF; --ios-red: #FF453A; --ios-orange: #FF9F0A;
            --ios-green: #30D158; --ios-gray: #8E8E93;
        }

        body {
            background: var(--ios-bg); color: #fff;
            font-family: -apple-system, system-ui, sans-serif;
            -webkit-font-smoothing: antialiased;
            touch-action: manipulation;
            user-select: none;
            overflow-x: hidden;
        }

        .ios-card { background: var(--ios-card); border-radius: 16px; border: 1px solid rgba(255,255,255,0.05); }
        .tab-content { display: none; }
        .tab-content.active { display: block; animation: fadeIn 0.25s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(4px);} to { opacity: 1; transform: translateY(0);} }

        .bottom-sheet {
            position: fixed; bottom: 0; left: 0; right: 0;
            background: #1c1c1e; border-top-left-radius: 28px; border-top-right-radius: 28px;
            transform: translateY(105%); transition: transform 0.4s cubic-bezier(0.25, 1, 0.5, 1);
            z-index: 100; padding: 24px; padding-bottom: calc(60px + env(safe-area-inset-bottom));
            box-shadow: 0 -15px 50px rgba(0,0,0,0.8);
            max-height: 85vh; overflow-y: auto;
        }
        .bottom-sheet.active { transform: translateY(0); }
        .sheet-backdrop {
            position: fixed; inset: 0; background: rgba(0,0,0,0.5);
            opacity: 0; pointer-events: none; transition: opacity 0.3s; z-index: 90;
        }
        .sheet-backdrop.active { opacity: 1; pointer-events: auto; }
        .sheet-handle { width: 40px; height: 5px; background: #3a3a3c; border-radius: 10px; margin: -10px auto 25px auto; }

        .input-group { margin-bottom: 18px; text-align: center; }
        .input-group label {
            display: block; color: var(--ios-gray); font-size: 11px;
            text-transform: uppercase; font-weight: 700; margin-bottom: 8px;
            letter-spacing: 0.05em;
        }
        input, select {
            background: #2c2c2e !important; border: none; color: white;
            border-radius: 16px; width: 100%; outline: none;
            font-size: 17px; height: 58px;
            text-align: center !important;
            text-align-last: center !important;
        }
        input:focus, select:focus { box-shadow: 0 0 0 2px var(--ios-blue); }
        input.input-error { box-shadow: 0 0 0 2px var(--ios-red); }
        input:-webkit-autofill { -webkit-box-shadow: 0 0 0 1000px #2c2c2e inset !important; -webkit-text-fill-color: white !important; }

        .strikethrough { opacity: 0.1; filter: grayscale(1); transform: scale(0.98); pointer-events: none; transition: 0.6s; }

        .icon-btn { color: var(--ios-gray); transition: all 0.2s; cursor: pointer; }
        .icon-btn:active { transform: scale(0.85); opacity: 0.6; }

        .check-btn { transition: all 0.15s; }
        .check-btn:active { transform: scale(0.85); }
        .check-btn.done { background: var(--ios-green); border-color: var(--ios-green) !important; }

        .empty-state { text-align: center; padding: 70px 20px; color: var(--ios-gray); }
        .empty-state i { font-size: 34px; margin-bottom: 14px; opacity: 0.5; display: block; }
        .empty-state p { font-size: 14px; font-weight: 600; }

        .toast {
            position: fixed; top: 16px; left: 50%; transform: translateX(-50%) translateY(-60px);
            background: #2c2c2e; color: white; padding: 12px 20px; border-radius: 14px;
            font-size: 13px; font-weight: 600; z-index: 200; transition: transform 0.35s ease;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5); pointer-events: none;
        }
        .toast.show { transform: translateX(-50%) translateY(0); }

        .fab-hidden { display: none !important; }
    </style>
</head>
<body class="safe-top">

    <div id="toast" class="toast"></div>

    <div id="loader" class="fixed top-6 right-6 z-[60] opacity-0 transition-opacity">
        <i class="fa-solid fa-circle-notch fa-spin text-blue-500 text-xl"></i>
    </div>

    <header class="px-6 pt-6 pb-2 sticky top-0 bg-black/90 backdrop-blur-xl z-40">
        <div class="flex justify-between items-center mb-4">
            <h1 id="view-title" class="text-3xl font-bold tracking-tight text-white">Action</h1>
            <button id="plus-btn" onclick="openEntryModal()" class="fab-hidden text-blue-500 text-2xl p-2 active:scale-95 transition-transform">
                <i class="fa-solid fa-plus"></i>
            </button>
        </div>

        <div id="dashboard-tiles" class="grid grid-cols-2 gap-3 mb-4">
            <div class="ios-card p-4">
                <p id="t1-label" class="text-[10px] text-gray-500 font-bold uppercase mb-1">DUE 1/2:</p>
                <p id="t1-sum" class="text-2xl font-bold tracking-tight">$0</p>
            </div>
            <div class="ios-card p-4">
                <p id="t2-label" class="text-[10px] text-gray-500 font-bold uppercase mb-1">DUE 2/2:</p>
                <p id="t2-sum" class="text-2xl font-bold tracking-tight">$0</p>
            </div>
        </div>
    </header>

    <main class="px-4 pb-36">
        <div id="view-action" class="tab-content active space-y-3"></div>
        <div id="view-terms" class="tab-content space-y-4"></div>
        <div id="view-fixed" class="tab-content space-y-2"></div>
        <div id="view-history" class="tab-content space-y-3"></div>
    </main>

    <nav class="fixed bottom-0 w-full bg-[#161618]/95 backdrop-blur-2xl border-t border-white/5 pb-8 pt-3 z-50">
        <div class="flex justify-around items-center max-w-md mx-auto">
            <button onclick="switchTab('action')" class="nav-btn text-blue-500 flex flex-col items-center" data-tab="action">
                <i class="fa-solid fa-bolt-lightning text-xl mb-1"></i>
                <span class="text-[9px] font-bold uppercase tracking-tighter">Action</span>
            </button>
            <button onclick="switchTab('terms')" class="nav-btn text-gray-500 flex flex-col items-center" data-tab="terms">
                <i class="fa-solid fa-calendar-days text-xl mb-1"></i>
                <span class="text-[9px] font-bold uppercase tracking-tighter">Terms</span>
            </button>
            <button onclick="switchTab('fixed')" class="nav-btn text-gray-500 flex flex-col items-center" data-tab="fixed">
                <i class="fa-solid fa-layer-group text-xl mb-1"></i>
                <span class="text-[9px] font-bold uppercase tracking-tighter">Fixed</span>
            </button>
            <button onclick="switchTab('history')" class="nav-btn text-gray-500 flex flex-col items-center" data-tab="history">
                <i class="fa-solid fa-clock-rotate-left text-xl mb-1"></i>
                <span class="text-[9px] font-bold uppercase tracking-tighter">History</span>
            </button>
        </div>
    </nav>

    <div id="sheet-backdrop" class="sheet-backdrop" onclick="closeModal()"></div>

    <!-- Fixed Entry Modal -->
    <div id="sheet-fixed" class="bottom-sheet">
        <div class="sheet-handle"></div>
        <input type="hidden" id="f-id">
        <div class="flex justify-between items-center mb-8">
            <button onclick="closeModal()" class="text-blue-500 text-lg">Cancel</button>
            <span class="font-bold text-lg">Fixed Expense</span>
            <button onclick="submitFixed()" class="text-blue-500 font-bold text-lg">Save</button>
        </div>
        <div class="input-group"><label>Expense Name</label><input type="text" id="fx-name" autocomplete="off" placeholder="e.g. Rent"></div>
        <div class="input-group"><label>Amount</label><input type="number" id="f-amount" inputmode="decimal" placeholder="0.00"></div>
        <div class="input-group"><label>Frequency</label>
            <select id="f-freq" onchange="toggleDateUI()">
                <option>Monthly</option>
                <option>Weekly</option>
                <option>Bi-weekly</option>
            </select>
        </div>
        <div id="f-date-container" class="input-group"></div>
    </div>

    <!-- Terms Entry Modal -->
    <div id="sheet-terms" class="bottom-sheet">
        <div class="sheet-handle"></div>
        <input type="hidden" id="t-id">
        <div class="flex justify-between items-center mb-8">
            <button onclick="closeModal()" class="text-blue-500 text-lg">Cancel</button>
            <span class="font-bold text-lg">Term Bill</span>
            <button onclick="submitTerm()" class="text-blue-500 font-bold text-lg">Save</button>
        </div>
        <div class="input-group"><label>Expense Name</label><input type="text" id="tr-name" autocomplete="off" placeholder="e.g. Laptop Financing"></div>
        <div class="grid grid-cols-2 gap-4">
            <div class="input-group"><label id="t-balance-label">Balance</label><input type="number" id="t-balance" inputmode="decimal" placeholder="0.00"></div>
            <div class="input-group"><label>Payment</label><input type="number" id="t-amount" inputmode="decimal" placeholder="0.00"></div>
        </div>
        <div class="input-group"><label>Due Day (1-31)</label><input type="number" id="t-day" min="1" max="31" placeholder="e.g. 15"></div>
    </div>

    <script>
        const API_URL = "YOUR_APPS_SCRIPT_URL";
        let cache = { action: [], terms: [], fixed: [], history: [] };
        let activeTab = 'action';
        const months = ["JAN","FEB","MAR","APR","MAY","JUN","JUL","AUG","SEP","OCT","NOV","DEC"];
        const monthNames = ["January","February","March","April","May","June","July","August","September","October","November","December"];

        // ---------- Utilities ----------
        function fmtMoney(n) {
            const v = Number(n) || 0;
            return "$" + v.toLocaleString(undefined, { minimumFractionDigits: 0, maximumFractionDigits: 2 });
        }

        function parseLocalDate(str) {
            // Avoid UTC off-by-one: treat "yyyy-MM-dd" as local date
            const [y, m, d] = String(str).split(/[-T]/)[0].split('-').map(Number);
            return new Date(y, m - 1, d);
        }

        function dueLabel(dateStr) {
            const d = parseLocalDate(dateStr);
            const today = new Date(); today.setHours(0,0,0,0);
            d.setHours(0,0,0,0);
            const diffDays = Math.round((d - today) / 86400000);
            const dateText = `${months[d.getMonth()]} ${d.getDate()}`;
            if (diffDays < 0) return { text: `OVERDUE • ${dateText}`, cls: 'text-red-500' };
            if (diffDays === 0) return { text: `DUE TODAY`, cls: 'text-orange-400' };
            if (diffDays <= 3) return { text: `DUE ${dateText} • ${diffDays}D`, cls: 'text-orange-400' };
            return { text: `DUE ${dateText}`, cls: 'text-gray-500' };
        }

        function showToast(msg) {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.classList.add('show');
            clearTimeout(t._timer);
            t._timer = setTimeout(() => t.classList.remove('show'), 2200);
        }

        function escapeHtml(str) {
            return String(str ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
        }

        // ---------- Data ----------
        async function fetchData(showSpinner = true) {
            if (showSpinner) document.getElementById('loader').style.opacity = "1";
            try {
                const res = await fetch(API_URL);
                cache = await res.json();
                render();
            } catch (e) {
                console.error(e);
                showToast("Couldn't sync — check connection");
            }
            document.getElementById('loader').style.opacity = "0";
        }

        function render() {
            const today = new Date();
            const dash = document.getElementById('dashboard-tiles');
            if (activeTab === 'action') {
                dash.style.display = "grid";
                document.getElementById('view-title').innerText = `${monthNames[today.getMonth()]}`;
                renderAction(today);
            } else {
                dash.style.display = "none";
                document.getElementById('view-title').innerText = activeTab.charAt(0).toUpperCase() + activeTab.slice(1);
            }
            renderTerms();
            renderFixed();
            renderHistory();
        }

        function renderAction(today) {
            const container = document.getElementById('view-action');
            const curMonthIdx = today.getMonth();
            const curYear = today.getFullYear();
            let s1 = 0, s2 = 0;

            const items = [...cache.action].sort((a, b) => parseLocalDate(a.DueDate) - parseLocalDate(b.DueDate));

            if (items.length === 0) {
                container.innerHTML = `<div class="empty-state"><i class="fa-solid fa-champagne-glasses"></i><p>No bills due — you're all caught up</p></div>`;
            } else {
                container.innerHTML = items.map(item => {
                    const d = parseLocalDate(item.DueDate);
                    const val = parseFloat(item.Amount) || 0;
                    if (d.getMonth() === curMonthIdx && d.getFullYear() === curYear) {
                        if (d.getDate() <= 14) s1 += val; else s2 += val;
                    }
                    const label = dueLabel(item.DueDate);
                    return `<div class="ios-card p-4 flex items-center justify-between" id="row-${item.ID}">
                        <div class="flex items-center space-x-4">
                            <button onclick="markPaid('${item.ID}')" class="check-btn w-8 h-8 rounded-full border-2 border-gray-700 flex items-center justify-center">
                                <i class="fa-solid fa-check text-[11px] opacity-0"></i>
                            </button>
                            <div>
                                <p class="font-bold text-[17px] tracking-tight text-white">${escapeHtml(item.Name)}</p>
                                <p class="text-[11px] font-bold uppercase tracking-widest ${label.cls}">${label.text}</p>
                            </div>
                        </div>
                        <p class="text-xl font-bold tracking-tight text-white">${fmtMoney(val)}</p>
                    </div>`;
                }).join('');
            }

            document.getElementById('t1-label').innerText = `${months[curMonthIdx]} 1/2 DUE:`;
            document.getElementById('t2-label').innerText = `${months[curMonthIdx]} 2/2 DUE:`;
            document.getElementById('t1-sum').innerText = fmtMoney(s1);
            document.getElementById('t2-sum').innerText = fmtMoney(s2);
        }

        function renderTerms() {
            const el = document.getElementById('view-terms');
            if (cache.terms.length === 0) {
                el.innerHTML = `<div class="empty-state"><i class="fa-solid fa-calendar-days"></i><p>No term bills yet — tap + to add one</p></div>`;
                return;
            }
            el.innerHTML = cache.terms.map(t => {
                const remaining = Number(t.RemainingBalance) || 0;
                const original = Number(t.OriginalBalance) || remaining || 1;
                const pct = Math.min(100, Math.max(0, Math.round((1 - remaining / original) * 100)));
                return `<div class="ios-card p-5">
                    <div class="flex justify-between items-start mb-4">
                        <div>
                            <h2 class="text-xl font-bold tracking-tight text-white">${escapeHtml(t.Name)}</h2>
                            <p class="text-[10px] text-gray-500 font-bold uppercase tracking-widest mt-1">Due day ${escapeHtml(String(t.DueDay))} • ${pct}% paid off</p>
                        </div>
                        <div class="flex space-x-5 text-gray-500 shrink-0 ml-3">
                            <i onclick="editMaster('terms', '${t.ID}')" class="fa-regular fa-pen-to-square text-lg icon-btn"></i>
                            <i onclick="op('deleteMaster', {type:'Terms', id:'${t.ID}'})" class="fa-regular fa-trash-can text-lg icon-btn"></i>
                        </div>
                    </div>
                    <div class="grid grid-cols-2 gap-3 text-center">
                        <div class="bg-white/5 py-4 rounded-xl">
                            <p class="text-[9px] text-gray-500 font-bold uppercase mb-1">Payment</p>
                            <p class="text-lg font-bold text-white">${fmtMoney(t.PaymentAmount)}</p>
                        </div>
                        <div class="bg-white/5 py-4 rounded-xl">
                            <p class="text-[9px] text-gray-500 font-bold uppercase mb-1">Balance</p>
                            <p class="text-lg font-bold text-white">${fmtMoney(remaining)}</p>
                        </div>
                    </div>
                </div>`;
            }).join('');
        }

        function renderFixed() {
            const el = document.getElementById('view-fixed');
            if (cache.fixed.length === 0) {
                el.innerHTML = `<div class="empty-state"><i class="fa-solid fa-layer-group"></i><p>No fixed expenses yet — tap + to add one</p></div>`;
                return;
            }
            el.innerHTML = cache.fixed.map(f => `<div class="ios-card p-4 flex justify-between items-center mb-2">
                <div>
                    <p class="font-bold text-[17px] tracking-tight text-white">${escapeHtml(f.Name)}</p>
                    <p class="text-[10px] text-gray-500 font-bold uppercase tracking-widest">${escapeHtml(f.Frequency)} • ${escapeHtml(String(f.DueDay))}</p>
                </div>
                <div class="flex items-center space-x-5">
                    <p class="font-bold text-[17px] text-white">${fmtMoney(f.Amount)}</p>
                    <i onclick="editMaster('fixed', '${f.ID}')" class="fa-regular fa-pen-to-square text-gray-500 icon-btn"></i>
                    <i onclick="op('deleteMaster', {type:'Fixed', id:'${f.ID}'})" class="fa-regular fa-trash-can text-gray-500 icon-btn"></i>
                </div>
            </div>`).join('');
        }

        function renderHistory() {
            const el = document.getElementById('view-history');
            const items = [...cache.history].sort((a, b) => new Date(b.PaidDate) - new Date(a.PaidDate));
            if (items.length === 0) {
                el.innerHTML = `<div class="empty-state"><i class="fa-solid fa-clock-rotate-left"></i><p>Nothing paid yet</p></div>`;
                return;
            }
            el.innerHTML = items.map(h => `
                <div class="ios-card p-4 flex items-center justify-between opacity-60">
                    <div class="flex items-center space-x-4">
                        <i class="fa-solid fa-circle-check text-blue-500 text-lg"></i>
                        <div class="leading-tight">
                            <p class="font-bold text-white text-[16px]">${escapeHtml(h.Name)}</p>
                            <p class="text-[10px] text-gray-500 font-bold uppercase">Due: ${parseLocalDate(h.OriginalDueDate).toLocaleDateString()}</p>
                            <p class="text-[10px] text-gray-400 font-bold uppercase">Paid: ${new Date(h.PaidDate).toLocaleDateString()}</p>
                        </div>
                    </div>
                    <div class="flex items-center space-x-5">
                        <p class="font-bold text-gray-400 tracking-tight">${fmtMoney(h.Amount)}</p>
                        <i onclick="op('undoHistory', {id:'${h.ID}'})" class="fa-solid fa-rotate-left text-gray-500 icon-btn text-lg"></i>
                        <i onclick="op('deleteHistory', {id:'${h.ID}'})" class="fa-regular fa-trash-can text-gray-500 icon-btn text-lg"></i>
                    </div>
                </div>`).join('');
        }

        // ---------- Actions ----------
        async function op(action, params) {
            if (action === 'deleteMaster' && !confirm('Delete this and all its upcoming bills?')) return;
            if (action === 'deleteHistory' && !confirm('Permanently delete this record?')) return;
            if (action === 'undoHistory' && !confirm('Mark this as unpaid again?')) return;

            document.getElementById('loader').style.opacity = "1";
            try {
                await fetch(API_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify({ action, ...params }) });
            } catch (e) {
                console.error(e);
                showToast("Something went wrong");
            }
            setTimeout(() => fetchData(false), 900);
        }

        async function markPaid(id) {
            const row = document.getElementById(`row-${id}`);
            if (row) {
                row.querySelector('.check-btn').classList.add('done');
                row.querySelector('.check-btn i').classList.remove('opacity-0');
                setTimeout(() => row.classList.add('strikethrough'), 120);
            }
            await op('completeAction', { id });
        }

        function switchTab(t) {
            activeTab = t;
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.replace('text-blue-500', 'text-gray-500'));
            document.getElementById(`view-${t}`).classList.add('active');
            document.querySelector(`[data-tab="${t}"]`).classList.replace('text-gray-500', 'text-blue-500');
            document.getElementById('plus-btn').classList.toggle('fab-hidden', (t !== 'fixed' && t !== 'terms'));
            render();
        }

        function editMaster(type, id) {
            const item = cache[type].find(i => i.ID === id);
            if (!item) return;
            activeTab = type;
            openEntryModal(true);
            if (type === 'fixed') {
                document.getElementById('f-id').value = id;
                document.getElementById('fx-name').value = item.Name;
                document.getElementById('f-amount').value = item.Amount;
                document.getElementById('f-freq').value = item.Frequency;
                toggleDateUI();
                document.getElementById('f-day').value = item.DueDay;
            } else {
                document.getElementById('t-id').value = id;
                document.getElementById('tr-name').value = item.Name;
                document.getElementById('t-balance').value = item.RemainingBalance;
                document.getElementById('t-day').value = item.DueDay;
                document.getElementById('t-amount').value = item.PaymentAmount;
                document.getElementById('t-balance-label').innerText = 'Remaining Balance';
            }
        }

        function openEntryModal(isEdit = false) {
            if (!isEdit) {
                document.getElementById('f-id').value = "";
                document.getElementById('t-id').value = "";
                document.querySelectorAll('.bottom-sheet input').forEach(i => { i.value = ""; i.classList.remove('input-error'); });
                document.getElementById('t-balance-label').innerText = 'Balance';
            }
            document.getElementById(`sheet-${activeTab}`).classList.add('active');
            document.getElementById('sheet-backdrop').classList.add('active');
            if (activeTab === 'fixed' && !isEdit) toggleDateUI();
        }

        function closeModal() {
            document.querySelectorAll('.bottom-sheet').forEach(s => s.classList.remove('active'));
            document.getElementById('sheet-backdrop').classList.remove('active');
        }

        function toggleDateUI() {
            const f = document.getElementById('f-freq')?.value;
            const c = document.getElementById('f-date-container');
            if (!c) return;
            if (f === 'Monthly') {
                c.innerHTML = `<label>Due Day</label><select id="f-day">${[...Array(31).keys()].map(i => `<option>${i + 1}</option>`).join('')}</select>`;
            } else {
                c.innerHTML = `<label>Due Day</label><select id="f-day">${['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'].map(d => `<option>${d}</option>`).join('')}</select>`;
            }
        }

        function markInvalid(el) {
            el.classList.add('input-error');
            setTimeout(() => el.classList.remove('input-error'), 1200);
        }

        function validateFields(fields) {
            let ok = true;
            fields.forEach(({ el, valid }) => { if (!valid) { markInvalid(el); ok = false; } });
            return ok;
        }

        async function submitFixed() {
            const id = document.getElementById('f-id').value;
            const nameEl = document.getElementById('fx-name');
            const amountEl = document.getElementById('f-amount');
            const name = nameEl.value.trim();
            const amount = parseFloat(amountEl.value);

            if (!validateFields([
                { el: nameEl, valid: name.length > 0 },
                { el: amountEl, valid: amount > 0 }
            ])) return;

            const freq = document.getElementById('f-freq').value;
            const dueDay = document.getElementById('f-day').value;
            await op(id ? 'updateFixed' : 'addFixed', { id, data: { name, amount, freq, dueDay } });
            closeModal();
            showToast(id ? 'Fixed expense updated' : 'Fixed expense added');
        }

        async function submitTerm() {
            const id = document.getElementById('t-id').value;
            const nameEl = document.getElementById('tr-name');
            const balanceEl = document.getElementById('t-balance');
            const amountEl = document.getElementById('t-amount');
            const dayEl = document.getElementById('t-day');

            const name = nameEl.value.trim();
            const balance = parseFloat(balanceEl.value);
            const amount = parseFloat(amountEl.value);
            const day = parseInt(dayEl.value);

            if (!validateFields([
                { el: nameEl, valid: name.length > 0 },
                { el: balanceEl, valid: balance >= 0 },
                { el: amountEl, valid: amount > 0 },
                { el: dayEl, valid: day >= 1 && day <= 31 }
            ])) return;

            await op(id ? 'updateTerm' : 'addTerm', { id, data: { name, balance, amount, dueDay: day } });
            closeModal();
            showToast(id ? 'Term bill updated' : 'Term bill added');
        }

        window.onload = () => fetchData();
    </script>
</body>
</html>
