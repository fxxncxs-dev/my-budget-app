<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Budget iOS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        :root { --ios-blue: #007AFF; --ios-bg: #000; --ios-card: #1c1c1e; }
        body { background: var(--ios-bg); color: #fff; font-family: -apple-system, sans-serif; overflow-x: hidden; }
        .ios-card { background: var(--ios-card); border-radius: 14px; overflow: hidden; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .bottom-sheet { transform: translateY(100%); transition: transform 0.4s cubic-bezier(0.15, 1, 0.3, 1); z-index: 100; }
        .bottom-sheet.active { transform: translateY(0); }
        .strikethrough { text-decoration: line-through; opacity: 0.5; transition: 0.4s; }
        
        /* Swipe Styles */
        .swipe-container { position: relative; overflow: hidden; touch-action: pan-y; }
        .swipe-content { position: relative; z-index: 10; transition: transform 0.3s ease; background: var(--ios-card); }
        .action-blue { background: #007AFF; left: 0; }
        .action-red { background: #FF3B30; right: 0; }
        .swipe-bg { position: absolute; top: 0; bottom: 0; width: 100%; display: flex; align-items: center; padding: 0 20px; font-weight: bold; font-size: 13px; }
    </style>
</head>
<body class="safe-top">

    <header class="p-6 sticky top-0 bg-black/80 backdrop-blur-lg z-40 flex justify-between items-center">
        <h1 id="page-title" class="text-3xl font-bold">August</h1>
        <div id="header-plus" class="hidden">
            <button onclick="openEntryModal()" class="text-blue-500 text-2xl"><i class="fa-solid fa-plus"></i></button>
        </div>
    </header>

    <main class="px-4 pb-32">
        <div id="view-action" class="tab-content active space-y-3"></div>
        <div id="view-terms" class="tab-content space-y-4"></div>
        <div id="view-fixed" class="tab-content space-y-2"></div>
        <div id="view-history" class="tab-content space-y-2"></div>
    </main>

    <!-- Bottom Nav -->
    <nav class="fixed bottom-0 w-full bg-[#161618]/90 backdrop-blur-xl border-t border-white/10 pb-8 pt-3 z-50">
        <div class="flex justify-around">
            <button onclick="switchTab('action')" class="tab-btn text-blue-500 flex flex-col items-center" data-tab="action">
                <i class="fa-solid fa-bolt text-xl"></i><span class="text-[10px] mt-1">Action</span>
            </button>
            <button onclick="switchTab('terms')" class="tab-btn text-gray-500 flex flex-col items-center" data-tab="terms">
                <i class="fa-solid fa-calendar text-xl"></i><span class="text-[10px] mt-1">Terms</span>
            </button>
            <button onclick="switchTab('fixed')" class="tab-btn text-gray-500 flex flex-col items-center" data-tab="fixed">
                <i class="fa-solid fa-layer-group text-xl"></i><span class="text-[10px] mt-1">Fixed</span>
            </button>
            <button onclick="switchTab('history')" class="tab-btn text-gray-500 flex flex-col items-center" data-tab="history">
                <i class="fa-solid fa-clock text-xl"></i><span class="text-[10px] mt-1">History</span>
            </button>
        </div>
    </nav>

    <!-- Fixed Form -->
    <div id="modal-fixed" class="bottom-sheet fixed bottom-0 left-0 right-0 ios-card rounded-t-[20px] p-6 pb-12">
        <div class="flex justify-between items-center mb-6">
            <button onclick="closeModal()" class="text-blue-500">Cancel</button>
            <span class="font-bold">Fixed</span>
            <button onclick="saveFixed()" class="text-blue-500 font-bold">Save</button>
        </div>
        <div class="space-y-4">
            <input type="text" id="f-type" placeholder="Type (e.g. Note)" class="w-full bg-[#2c2c2e] p-4 rounded-xl outline-none">
            <input type="text" id="f-name" placeholder="Expense" class="w-full bg-[#2c2c2e] p-4 rounded-xl outline-none">
            <input type="number" id="f-amount" placeholder="Amount" class="w-full bg-[#2c2c2e] p-4 rounded-xl outline-none">
            <select id="f-freq" onchange="updateFixedDateUI()" class="w-full bg-[#2c2c2e] p-4 rounded-xl outline-none">
                <option>Monthly</option><option>Weekly</option>
            </select>
            <div id="f-date-box"></div>
        </div>
    </div>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbz8bhBAYEoUZySg8nDLytSbS37sBUDeBwnKdJHpuq7a7Is_nNHQ2mjHwwa7RvS8Qq53BQ/exec"; // REPLACE THIS
        let db = { action: [], terms: [], fixed: [], history: [] };

        async function loadData() {
            try {
                const res = await fetch(API_URL);
                db = await res.json();
                render();
            } catch (e) { console.log("Load failed"); }
        }

        function render() {
            renderAction();
            renderTerms();
            renderFixed();
            renderHistory();
        }

        function renderAction() {
            const container = document.getElementById('view-action');
            if (db.action.length === 0) { container.innerHTML = '<p class="text-center py-10 text-gray-500">All paid!</p>'; return; }
            
            container.innerHTML = db.action.map(item => `
                <div class="ios-card p-4 flex items-center justify-between" id="card-${item.Timestamp}">
                    <div class="flex items-center space-x-4">
                        <button onclick="markActionPaid('${item.Timestamp}')" class="w-7 h-7 rounded-full border-2 border-gray-600 flex items-center justify-center">
                            <div class="check-inner w-4 h-4 rounded-full"></div>
                        </button>
                        <div>
                            <p class="font-bold text-lg name-label">${item.Name}</p>
                            <p class="text-xs text-gray-500">Due: ${item.DueDate}</p>
                        </div>
                    </div>
                    <p class="text-xl font-medium">${Number(item.Amount).toLocaleString()}</p>
                </div>
            `).join('');
        }

        async function markActionPaid(ts) {
            const item = db.action.find(i => i.Timestamp == ts);
            const card = document.getElementById(`card-${ts}`);
            card.querySelector('.name-label').classList.add('strikethrough');
            card.querySelector('.check-inner').style.background = '#34C759';

            await fetch(API_URL, {
                method: 'POST',
                mode: 'no-cors',
                body: JSON.stringify({ action: 'completeAction', item: item })
            });
            setTimeout(loadData, 600);
        }

        // Swipe logic for History
        let touchStartX = 0;
        function handleSwipe(e, ts) {
            const touch = e.changedTouches[0];
            const diff = touch.clientX - touchStartX;
            const content = e.currentTarget.querySelector('.swipe-content');
            
            if (diff > 100) { // Swipe Right -> Unpaid
                content.style.transform = "translateX(100%)";
                confirmAction('undoHistory', ts);
            } else if (diff < -100) { // Swipe Left -> Delete
                content.style.transform = "translateX(-100%)";
                if(confirm("Delete permanently?")) confirmAction('deleteHistory', ts);
                else content.style.transform = "translateX(0)";
            } else {
                content.style.transform = "translateX(0)";
            }
        }

        async function confirmAction(type, ts) {
            await fetch(API_URL, {
                method: 'POST',
                mode: 'no-cors',
                body: JSON.stringify({ action: type, timestamp: ts })
            });
            loadData();
        }

        function renderHistory() {
            const container = document.getElementById('view-history');
            container.innerHTML = db.history.map(item => `
                <div class="swipe-container ios-card mb-2" ontouchstart="touchStartX = event.touches[0].clientX" ontouchend="handleSwipe(event, '${item.ID}')">
                    <div class="swipe-bg action-blue">Mark Unpaid</div>
                    <div class="swipe-bg action-red justify-end">Delete</div>
                    <div class="swipe-content p-4 flex items-center justify-between">
                        <div class="flex items-center space-x-4">
                            <i class="fa-solid fa-circle-check text-blue-500"></i>
                            <div>
                                <p class="text-gray-400 font-bold">${item.Name}</p>
                                <p class="text-[10px] text-gray-600 uppercase">${item.CompletionDate}</p>
                            </div>
                        </div>
                        <p class="text-gray-500 font-bold">${Number(item.Amount).toLocaleString()}</p>
                    </div>
                </div>
            `).join('');
        }

        // Standard SPA Nav
        function switchTab(tab) {
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.replace('text-blue-500', 'text-gray-500'));
            
            document.getElementById(`view-${tab}`).classList.add('active');
            document.querySelector(`[data-tab="${tab}"]`).classList.replace('text-gray-500', 'text-blue-500');
            
            document.getElementById('header-plus').classList.toggle('hidden', tab !== 'fixed' && tab !== 'terms');
            document.getElementById('page-title').innerText = tab.charAt(0).toUpperCase() + tab.slice(1);
            if(tab === 'action') document.getElementById('page-title').innerText = 'August';
        }

        function openEntryModal() {
            document.getElementById('modal-fixed').classList.add('active');
            updateFixedDateUI();
        }

        function closeModal() {
            document.querySelectorAll('.bottom-sheet').forEach(m => m.classList.remove('active'));
        }

        function updateFixedDateUI() {
            const freq = document.getElementById('f-freq').value;
            const container = document.getElementById('f-date-box');
            if(freq === 'Monthly') {
                container.innerHTML = `<select id="f-date" class="w-full bg-[#2c2c2e] p-4 rounded-xl outline-none">
                    ${Array.from({length:31}, (_,i) => `<option>${i+1}</option>`).join('')}
                </select>`;
            } else {
                const days = ['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];
                container.innerHTML = `<select id="f-date" class="w-full bg-[#2c2c2e] p-4 rounded-xl outline-none">
                    ${days.map(d => `<option>${d}</option>`).join('')}
                </select>`;
            }
        }

        async function saveFixed() {
            const payload = {
                action: 'addFixed',
                type: document.getElementById('f-type').value,
                name: document.getElementById('f-name').value,
                amount: document.getElementById('f-amount').value,
                freq: document.getElementById('f-freq').value,
                date: document.getElementById('f-date').value
            };
            await fetch(API_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify(payload) });
            closeModal();
            loadData();
        }

        window.onload = loadData;
    </script>
</body>
</html>
