<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Budget iOS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background: #000; color: #fff; font-family: -apple-system, sans-serif; }
        .ios-card { background: #1c1c1e; border-radius: 14px; }
        .safe-top { padding-top: env(safe-area-inset-top); }
        .safe-bottom { padding-bottom: env(safe-area-inset-bottom); }
        .bottom-sheet { transform: translateY(100%); transition: transform 0.4s cubic-bezier(0.3, 0.8, 0.4, 1); }
        .bottom-sheet.active { transform: translateY(0); }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        ::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="h-screen flex flex-col overflow-hidden">

    <header class="safe-top bg-black/80 backdrop-blur-md border-b border-white/10 sticky top-0 z-50">
        <div class="px-6 py-4 flex justify-between items-center">
            <h1 id="page-title" class="text-2xl font-bold">Action</h1>
            <select id="user-switcher" class="bg-[#1c1c1e] px-3 py-1 rounded-full text-sm">
                <option>Francis</option><option>Mely</option>
            </select>
        </div>
    </header>

    <main class="flex-1 overflow-y-auto px-4 pb-32 pt-4">
        <!-- Action Dashboard -->
        <div id="view-action" class="tab-content active space-y-3">
            <div id="action-list" class="space-y-3">
                <!-- Data will load here -->
                <div class="text-center py-10 text-gray-500 animate-pulse">Loading items...</div>
            </div>
        </div>

        <div id="view-terms" class="tab-content">
            <h2 class="text-gray-400 uppercase text-xs font-bold mb-4 ml-2">Add Terms Item</h2>
            <button onclick="openModal('Terms')" class="w-full ios-card p-4 text-blue-500 font-bold flex items-center justify-center">
                <i class="fa-solid fa-plus mr-2"></i> New Term Bill
            </button>
        </div>

        <div id="view-fixed" class="tab-content">
            <h2 class="text-gray-400 uppercase text-xs font-bold mb-4 ml-2">Add Fixed Item</h2>
            <button onclick="openModal('Fixed')" class="w-full ios-card p-4 text-blue-500 font-bold flex items-center justify-center">
                <i class="fa-solid fa-plus mr-2"></i> New Fixed Bill
            </button>
        </div>

        <div id="view-history" class="tab-content text-center py-10 text-gray-500">History synced with Sheet.</div>
    </main>

    <nav class="safe-bottom bg-[#161618]/90 backdrop-blur-xl border-t border-white/10 fixed bottom-0 w-full z-50">
        <div class="flex justify-around py-3">
            <button onclick="switchTab('action')" class="flex flex-col items-center text-blue-500"><i class="fa-solid fa-bolt"></i><span class="text-[10px]">Action</span></button>
            <button onclick="switchTab('terms')" class="flex flex-col items-center text-gray-500"><i class="fa-solid fa-calendar"></i><span class="text-[10px]">Terms</span></button>
            <button onclick="switchTab('fixed')" class="flex flex-col items-center text-gray-500"><i class="fa-solid fa-layer-group"></i><span class="text-[10px]">Fixed</span></button>
            <button onclick="switchTab('history')" class="flex flex-col items-center text-gray-500"><i class="fa-solid fa-clock"></i><span class="text-[10px]">History</span></button>
        </div>
    </nav>

    <!-- Bottom Sheet Modal -->
    <div id="modal-overlay" onclick="closeModal()" class="fixed inset-0 bg-black/60 hidden z-[60]"></div>
    <div id="bottom-sheet" class="bottom-sheet fixed bottom-0 left-0 right-0 ios-card rounded-t-[20px] z-[70] p-6 pb-12">
        <h2 id="modal-title" class="text-xl font-bold mb-6">Add Bill</h2>
        <form id="bill-form" class="space-y-4">
            <input type="hidden" id="entry-type">
            <input type="text" id="name" placeholder="Name" required class="w-full bg-[#2c2c2e] p-4 rounded-xl outline-none">
            <input type="number" id="amount" placeholder="Amount" required class="w-full bg-[#2c2c2e] p-4 rounded-xl outline-none">
            <input type="date" id="date" required class="w-full bg-[#2c2c2e] p-4 rounded-xl outline-none">
            <select id="freq" class="w-full bg-[#2c2c2e] p-4 rounded-xl outline-none"><option>Monthly</option><option>One-time</option></select>
            <button type="submit" id="save-btn" class="w-full bg-blue-600 py-4 rounded-xl font-bold">Save Bill</button>
        </form>
    </div>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbz8bhBAYEoUZySg8nDLytSbS37sBUDeBwnKdJHpuq7a7Is_nNHQ2mjHwwa7RvS8Qq53BQ/exec";

        async function loadData() {
            try {
                const res = await fetch(API_URL);
                const data = await res.json();
                renderActionList(data);
            } catch (e) { console.error(e); }
        }

        function renderActionList(items) {
            const list = document.getElementById('action-list');
            // Sort by Due Date (Oldest on top)
            items.sort((a, b) => new Date(a.DueDate) - new Date(b.DueDate));
            
            list.innerHTML = items.map(item => `
                <div class="ios-card p-4 flex items-center justify-between animate-in fade-in slide-in-from-bottom-2 duration-300">
                    <div class="flex items-center space-x-4">
                        <button onclick="completeItem('${item.Timestamp}', '${item.sourceSheet}')" class="w-7 h-7 rounded-full border-2 border-gray-600 flex items-center justify-center active:bg-green-500 transition-colors">
                            <i class="fa-solid fa-check text-xs text-transparent hover:text-white"></i>
                        </button>
                        <div>
                            <p class="font-bold">${item.Name}</p>
                            <p class="text-xs text-gray-500">${item.DueDate} • ${item.sourceSheet}</p>
                        </div>
                    </div>
                    <p class="font-semibold text-blue-400">$${item.Amount}</p>
                </div>
            `).join('') || '<p class="text-center text-gray-600 py-10">No pending bills!</p>';
        }

        async function completeItem(ts, source) {
            if (!confirm("Mark as paid?")) return;
            const payload = { action: 'complete', timestamp: ts, sourceSheet: source };
            await fetch(API_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify(payload) });
            loadData(); // Refresh UI
        }

        document.getElementById('bill-form').onsubmit = async (e) => {
            e.preventDefault();
            const btn = document.getElementById('save-btn');
            btn.innerText = "Saving..."; btn.disabled = true;

            const payload = {
                action: 'add',
                user: document.getElementById('user-switcher').value,
                expenseName: document.getElementById('name').value,
                amount: document.getElementById('amount').value,
                dueDate: document.getElementById('date').value,
                frequency: document.getElementById('freq').value,
                type: document.getElementById('entry-type').value
            };

            await fetch(API_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify(payload) });
            btn.innerText = "Save Bill"; btn.disabled = false;
            closeModal();
            loadData();
        };

        function switchTab(tab) {
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            document.getElementById(`view-${tab}`).classList.add('active');
            document.getElementById('page-title').innerText = tab.charAt(0).toUpperCase() + tab.slice(1);
            if (tab === 'action') loadData();
        }

        function openModal(type) {
            document.getElementById('entry-type').value = type;
            document.getElementById('modal-title').innerText = `New ${type} Bill`;
            document.getElementById('modal-overlay').classList.remove('hidden');
            document.getElementById('bottom-sheet').classList.add('active');
        }

        function closeModal() {
            document.getElementById('modal-overlay').classList.add('hidden');
            document.getElementById('bottom-sheet').classList.remove('active');
        }

        // Init
        loadData();
    </script>
</body>
</html>
